# suite-managed (deploy) — regenerated by conform, do not edit by hand.
# Local overrides (NOT generated): put them in deploy/docker-compose.override.yml.
name: topicresearcher
services:
  topicresearcher-backend:
    image: topicresearcher-backend:prod
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: prod
    container_name: topicresearcher-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      LIFE_INSTANCE: "${LIFE_INSTANCE:-personal}"
      LIFE_GATE_JWKS_URL: "${LIFE_GATE_JWKS_URL:-http://life-backend:9999/.well-known/jwks.json}"
    networks:
      - personal-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10052/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  personal-net:
    external: true
