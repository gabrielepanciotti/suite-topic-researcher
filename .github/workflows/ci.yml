name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TopicResearcher
        uses: actions/checkout@v4
        with:
          path: repo
      - name: Check out the Life framework
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFE_FRAMEWORK_REPO || 'suite-life' }}
          path: Life
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          python -m pip install ../Life/packages/shared ../Life/packages/backend-core ../Life/packages/learn-core
      - name: Run backend tests
        working-directory: repo
        run: python -m pytest -q backend/tests
